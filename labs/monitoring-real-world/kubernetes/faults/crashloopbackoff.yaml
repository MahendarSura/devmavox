apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command: ["/bin/sh","-c","echo intentional-startup-failure; exit 1"]
