apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--vm","1","--vm-bytes","256M","--vm-hang","1"]
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
