name: Monitoring Playground Build

on:
  push:
    branches:
      - feature/monitoring-playground-colorful-workspace-20261118
    paths:
      - ".github/workflows/monitoring-playground-build.yml"
      - "components/devmavox-learning/FeatureExplorer.tsx"
      - "components/devmavox-learning/MonitoringPlaygroundHome.tsx"
      - "components/devmavox-learning/MonitoringTopicPage.tsx"
      - "components/devmavox-learning/monitoring-topic-content.ts"
      - "app/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/monitoring-playground-build.yml"
      - "components/devmavox-learning/FeatureExplorer.tsx"
      - "components/devmavox-learning/MonitoringPlaygroundHome.tsx"
      - "components/devmavox-learning/MonitoringTopicPage.tsx"
      - "components/devmavox-learning/monitoring-topic-content.ts"
      - "app/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: monitoring-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript, Monitoring Playground lint and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint Monitoring Playground files
        run: npx eslint components/devmavox-learning/FeatureExplorer.tsx components/devmavox-learning/MonitoringPlaygroundHome.tsx components/devmavox-learning/MonitoringTopicPage.tsx components/devmavox-learning/monitoring-topic-content.ts

      - name: Next.js production build
        run: npm run build
