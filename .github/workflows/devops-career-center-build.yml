name: DevOps Career Center Build

on:
  push:
    branches:
      - feature/devops-career-center-complete-20261118
    paths:
      - ".github/workflows/devops-career-center-build.yml"
      - "components/devmavox-learning/CareerDashboard.tsx"
      - "components/devmavox-learning/CareerTopicPage.tsx"
      - "components/devmavox-learning/FeatureExplorer.tsx"
      - "components/devmavox-learning/career-topic-content.ts"
      - "components/devmavox-learning/feature-catalog.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/devops-career-center-build.yml"
      - "components/devmavox-learning/CareerDashboard.tsx"
      - "components/devmavox-learning/CareerTopicPage.tsx"
      - "components/devmavox-learning/FeatureExplorer.tsx"
      - "components/devmavox-learning/career-topic-content.ts"
      - "components/devmavox-learning/feature-catalog.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: devops-career-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript, DevOps Career Center lint and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: ESLint DevOps Career Center files
        run: npx eslint components/devmavox-learning/CareerDashboard.tsx components/devmavox-learning/CareerTopicPage.tsx components/devmavox-learning/FeatureExplorer.tsx components/devmavox-learning/career-topic-content.ts components/devmavox-learning/feature-catalog.ts
      - name: Next.js production build
        run: npm run build
