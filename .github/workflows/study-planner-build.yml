name: Study Planner Build

on:
  push:
    branches:
      - feature/study-planner-colorful-workspace-20261118
    paths:
      - ".github/workflows/study-planner-build.yml"
      - "app/study-planner/**"
      - "components/devmavox-learning/StudyPlanner.tsx"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/study-planner-build.yml"
      - "app/study-planner/**"
      - "components/devmavox-learning/StudyPlanner.tsx"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: study-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript, Study Planner lint and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint Study Planner files
        run: npx eslint "app/study-planner/**/*.tsx" components/devmavox-learning/StudyPlanner.tsx

      - name: Next.js production build
        run: npm run build
