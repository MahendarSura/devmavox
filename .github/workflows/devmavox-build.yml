name: DevMavox build verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/devops-knowledge-base-colorful-home-20261118

permissions:
  contents: read

concurrency:
  group: devmavox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build
