name: Incident Simulator Build

on:
  push:
    branches:
      - feature/incident-simulator-main-only-20261118
  pull_request:
    branches:
      - main
    paths:
      - "components/devmavox-learning/FeatureExplorer.tsx"
      - "components/devmavox-learning/IncidentCategoryPage.tsx"
      - "components/devmavox-learning/IncidentDashboard.tsx"
      - "components/devmavox-learning/IncidentSubcategoryPage.tsx"
      - "components/devmavox-learning/IncidentTopicPage.tsx"
      - "components/devmavox-learning/feature-catalog.ts"
      - "components/devmavox-learning/incident-topic-content.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/incident-simulator-build.yml"

permissions:
  contents: read

concurrency:
  group: incident-simulator-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: TypeScript, ESLint and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: ESLint (Incident Simulator files)
        run: >-
          npx eslint
          components/devmavox-learning/FeatureExplorer.tsx
          components/devmavox-learning/IncidentCategoryPage.tsx
          components/devmavox-learning/IncidentDashboard.tsx
          components/devmavox-learning/IncidentSubcategoryPage.tsx
          components/devmavox-learning/IncidentTopicPage.tsx
          components/devmavox-learning/feature-catalog.ts
          components/devmavox-learning/incident-topic-content.ts
      - name: Next.js production build
        run: npm run build
