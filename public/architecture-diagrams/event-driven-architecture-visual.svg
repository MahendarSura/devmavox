  <stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#172D4C"/>
 </linearGradient>
 <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#142B4B"/><stop offset="1" stop-color="#29234B"/>
 </linearGradient>
