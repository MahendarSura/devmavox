 <style>
 text{font-family:Segoe UI,Arial,sans-serif}
 .heading{font-size:28px;font-weight:800;fill:#F8FAFC;letter-spacing:1px}
 .sub{font-size:15px;fill:#B9C8DD}
 .zone-title{font-size:17px;font-weight:800;fill:#E2E8F0;letter-spacing:1px}
 .logo{font-size:11px;font-weight:900;letter-spacing:.5px}
 .node-title{font-size:17px;font-weight:800;fill:#F8FAFC}
 .detail{font-size:13px;fill:#C3D0E2}
 .flow-label{font-size:10px;font-weight:700;fill:#FDE68A}
