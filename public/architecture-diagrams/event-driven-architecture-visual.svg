 .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .gear{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
 .bubble{animation:float 4s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-34}}
 @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 </style>
