<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Logging Architecture architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071426" />
      <stop offset="1" stop-color="#10102b" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132b46" />
      <stop offset="1" stop-color="#101a31" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8" />
      <stop offset=".5" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dy="7" />
      <feComponentTransfer>
        <feFuncA type="linear" slope=".4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#67e8f9" />
    </marker>
    <style>
 .flow{stroke-linecap: round; marker-end: url(#arrow); stroke-width: 4; stroke-dasharray: 9 8; stroke: url(#line); fill: none; animation: dash 1.5s linear infinite}
 .card{fill:url(#card);stroke:#315477;stroke-width:1.6;filter:url(#shadow)}
 .gear{transform-box:fill-box;transform-origin:center;}
 .pulse{animation:none}
 .bubble{animation:none}
 .nodeTitle{font:700 21px Arial,sans-serif;fill:#f8fafc}
 .nodeTech{font:600 14px Arial,sans-serif;fill:#93c5fd}
 .nodeDesc{font:14px Arial,sans-serif;fill:#cbd5e1}
 .linkLabel{font:600 13px Arial,sans-serif;fill:#a5f3fc;text-anchor:middle;paint-order:stroke;stroke:#071426;stroke-width:5px;stroke-linejoin:round}
 @keyframes flow{to{stroke-dashoffset:-44}}}
 @keyframes spin{to{transform:rotate(360deg)}}}
 @keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
 
@keyframes dash{to{stroke-dashoffset:-34}}
</style>
